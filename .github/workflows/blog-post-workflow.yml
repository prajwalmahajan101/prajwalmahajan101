name: Latest blog post workflow

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Sync latest blog posts to README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The action treats any single-feed failure as fatal. Hashnode's
      # CDN occasionally 429s, which kills the run even when dev.to has
      # already committed an updated README. continue-on-error keeps the
      # job green while preserving the partial-sync behaviour.
      - name: Pull in latest posts
        continue-on-error: true
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # dev.to is primary now; Hashnode kept as secondary so older
          # posts there don't disappear from the profile feed.
          feed_list: "https://dev.to/feed/prajwalmahajan101,https://prajwalmahajan101.hashnode.dev/rss.xml"
          max_post_count: 4
          commit_message: "chore: sync latest blog posts"
          # $newline puts each post on its own line; tag_post_pre_newline
          # breaks the line right after the opening BLOG-POST-LIST marker
          # so the first entry sits on a fresh line too.
          template: "- 📝 **[$title]($url)** <sub>· $date</sub>$newline"
          tag_post_pre_newline: true
          date_format: "mmm d, yyyy"
          # Hashnode's CDN 403s the default "rss-parser" UA. Use a real
          # browser UA so the feed loads. Three retries ride out transient
          # CDN flakes (combined with the longer wait below).
          user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          retry_count: 3
          retry_wait_time: 10
