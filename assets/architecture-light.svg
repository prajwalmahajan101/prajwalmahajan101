<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" role="img" aria-labelledby="arch-light-title arch-light-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="arch-light-title">Public portfolio — how the projects connect</title>
  <desc id="arch-light-desc">Architecture diagram showing dependency relationships between public projects: resilience-kit feeds the three boilerplates, toyraft is embedded by toymq/toykv/toylock, toy-messenger composes toymq+toykv+toylock, beacon and the standalone apps are independent.</desc>

  <defs>
    <marker id="l-arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#656d76"/>
    </marker>
    <marker id="l-arrow-accent" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#eb6c36"/>
    </marker>
    <marker id="l-arrow-embed" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#0969da"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f2328">How the projects connect</text>
  <text x="40" y="52" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" letter-spacing="0.1em" fill="#8c959f">PUBLIC REPOS ONLY — DEPENDENCY &amp; EMBEDDING RELATIONSHIPS</text>

