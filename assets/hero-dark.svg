  <text x="48" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#e6edf3">Prajwal Mahajan</text>
  <rect x="50" y="104" width="56" height="3" rx="1.5" fill="#eb6c36"/>
  <text x="48" y="130" font-size="14.5" fill="#8b949e">Distributed systems · fintech · robotics · AI-integrated platforms — I build resilience kernels and the bottom of the stack, from scratch.</text>

