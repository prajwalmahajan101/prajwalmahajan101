  <text x="336" y="194" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="25" font-weight="600" fill="#1f2328">25K<tspan font-size="14" fill="#656d76"> req/s</tspan></text>
  <text x="336" y="212" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="9" letter-spacing="0.1em" fill="#656d76">BUSY-API · p95 7.4ms · 126× GAIN</text>

