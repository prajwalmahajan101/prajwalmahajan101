<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 528" role="img" aria-labelledby="hero-light-title hero-light-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="hero-light-title">Prajwal Mahajan — senior backend engineer, systems map</title>
  <desc id="hero-light-desc">A layered map of a public engineering portfolio: a Python resilience kernel, a from-scratch Go distributed-systems stack (toyraft consensus, toymq broker, toykv store, toybloom), the beacon observability platform, production boilerplates, shipped TUI apps, and work in flight.</desc>

