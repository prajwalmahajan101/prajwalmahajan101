  <rect width="1200" height="576" fill="#ffffff"/>

  <!-- header -->
  <text x="50" y="46" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="0.18em" fill="#eb6c36">SENIOR BACKEND ENGINEER · BENGALURU</text>
  <text x="48" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#1f2328">Prajwal Mahajan</text>
  <rect x="50" y="104" width="56" height="3" rx="1.5" fill="#eb6c36"/>
  <text x="48" y="130" font-size="14.5" fill="#656d76">Distributed systems · fintech · robotics · AI-integrated platforms — I build resilience kernels and the bottom of the stack, from scratch.</text>

